<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B0F14">
<title>FitLife — персональный фитнес</title>
<style>
/* ===================== THEME TOKENS ===================== */
:root{
  --accent:#C8FF3D; --accent-ink:#10160a;
  --purple:#7C5CFF; --blue:#4DA3FF; --green:#34D399; --orange:#FF8A3D;
  --red:#FF6B6B; --cyan:#39E6C3; --pink:#FF6BD6; --water:#46B7FF; --sleep:#9B7CFF;
  --r:22px; --r-sm:14px; --r-lg:30px;
  --maxw:480px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
}
html[data-theme="dark"]{
  --bg:#0B0F14; --bg2:#0E141B; --card:#161D26; --card2:#1B2530; --card3:#222E3B;
  --text:#EEF3F8; --muted:#8A97A6; --muted2:#5E6B7A;
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --shadow:0 16px 40px rgba(0,0,0,.45); --shadow-sm:0 6px 18px rgba(0,0,0,.35);
  --glow:0 8px 30px rgba(200,255,61,.25);
  --nav-bg:rgba(14,20,27,.86);
}
html[data-theme="light"]{
  --bg:#EEF1F6; --bg2:#FFFFFF; --card:#FFFFFF; --card2:#F4F7FB; --card3:#E9EEF5;
  --text:#0E1620; --muted:#5E6B7A; --muted2:#90A0B0;
  --line:rgba(13,22,32,.08); --line2:rgba(13,22,32,.14);
  --shadow:0 16px 40px rgba(20,40,70,.12); --shadow-sm:0 6px 18px rgba(20,40,70,.08);
  --glow:0 10px 30px rgba(124,92,255,.18);
  --nav-bg:rgba(255,255,255,.86);
  --accent-ink:#10160a;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--font); background:var(--bg); color:var(--text);
  min-height:100dvh; display:flex; justify-content:center; align-items:stretch;
  background-image:radial-gradient(1200px 600px at 50% -10%, color-mix(in srgb, var(--purple) 10%, transparent), transparent 60%);
}
/* phone frame */
#app{
  width:100%; max-width:var(--maxw); min-height:100dvh; position:relative;
  background:var(--bg); display:flex; flex-direction:column;
  box-shadow:var(--shadow); overflow:hidden;
}
@media(min-width:540px){
  body{padding:22px 0}
  #app{min-height:calc(100dvh - 44px); border-radius:36px; border:1px solid var(--line)}
}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit}
input,select{font-family:inherit}
::-webkit-scrollbar{width:0;height:0}
.scroll{overflow-y:auto; -webkit-overflow-scrolling:touch}

/* ===================== HEADER ===================== */
#top{
  position:sticky; top:0; z-index:30; padding:16px 18px 12px;
  background:linear-gradient(var(--bg), color-mix(in srgb,var(--bg) 80%, transparent));
  backdrop-filter:blur(10px); display:flex; align-items:center; gap:12px;
}
#top .ava{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--green));
  display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--accent-ink);font-size:17px;flex:0 0 auto}
#top .htxt{flex:1;min-width:0}
#top .hi{font-size:12.5px;color:var(--muted);font-weight:600}
#top .nm{font-size:18px;font-weight:800;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:18px;flex:0 0 auto;transition:.15s}
.iconbtn:active{transform:scale(.92)}

/* ===================== SCREEN ===================== */
#screen{flex:1; padding:4px 16px 120px; overflow-y:auto}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card2{background:var(--card2)}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 10px}
.sec-h h2{font-size:16.5px;font-weight:800;letter-spacing:-.3px;margin:0}
.sec-h .more{font-size:12.5px;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.row{display:flex;gap:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

/* pills/chips */
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:999px;background:var(--card);
  border:1px solid var(--line);font-size:13px;font-weight:700;white-space:nowrap}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.chiprow{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 18px;border-radius:16px;
  background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:15px;width:100%;transition:.15s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--card2);color:var(--text);border:1px solid var(--line)}
.btn.purple{background:linear-gradient(135deg,var(--purple),#5b7bff);color:#fff}
.btn.sm{padding:10px 14px;font-size:13px;width:auto;border-radius:12px}

/* progress ring */
.ring{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-linecap:round}

/* stat tiles */
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;position:relative;overflow:hidden}
.stat .lbl{font-size:12px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:6px}
.stat .val{font-size:23px;font-weight:850;letter-spacing:-.5px;margin-top:6px;line-height:1}
.stat .sub{font-size:11.5px;color:var(--muted);margin-top:3px;font-weight:600}
.dot{width:9px;height:9px;border-radius:50%}

/* task list */
.task{display:flex;align-items:center;gap:13px;padding:13px 14px;border-radius:16px;background:var(--card);
  border:1px solid var(--line);margin-bottom:9px;transition:.15s}
.task:active{transform:scale(.99)}
.task .ck{width:25px;height:25px;border-radius:9px;border:2px solid var(--line2);flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;font-size:14px;color:transparent;transition:.15s}
.task.done .ck{background:var(--accent);border-color:transparent;color:var(--accent-ink)}
.task .tt{flex:1;font-weight:700;font-size:14.5px}
.task.done .tt{color:var(--muted);text-decoration:line-through}
.task .ic{font-size:18px}

/* meal/exercise rows */
.lrow{display:flex;align-items:center;gap:13px;padding:13px 14px;border-radius:16px;background:var(--card);
  border:1px solid var(--line);margin-bottom:10px}
.lrow .em{width:44px;height:44px;border-radius:13px;background:var(--card2);display:flex;align-items:center;
  justify-content:center;font-size:21px;flex:0 0 auto}
.lrow .mid{flex:1;min-width:0}
.lrow .t1{font-weight:800;font-size:14.5px}
.lrow .t2{font-size:12px;color:var(--muted);font-weight:600;margin-top:2px}

/* progress bar */
.bar{height:9px;border-radius:99px;background:var(--card3);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .5s ease}

/* modal / overlay */
#modal,#overlay{position:fixed;inset:0;z-index:60;display:none}
#modal{align-items:flex-end;justify-content:center}
#modal.open,#overlay.open{display:flex}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(2px);animation:fade .2s}
.sheet{position:relative;width:100%;max-width:var(--maxw);background:var(--bg2);border-radius:26px 26px 0 0;
  border-top:1px solid var(--line);padding:10px 18px calc(20px + env(safe-area-inset-bottom));max-height:88dvh;overflow-y:auto;
  animation:up .3s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.grab{width:42px;height:5px;border-radius:99px;background:var(--line2);margin:6px auto 14px}
.field{margin-bottom:13px}
.field label{display:block;font-size:12.5px;color:var(--muted);font-weight:700;margin-bottom:6px}
.field input,.field select{width:100%;padding:13px 14px;border-radius:14px;background:var(--card);
  border:1px solid var(--line);color:var(--text);font-size:15px;outline:none}
.field input:focus{border-color:var(--accent)}

/* ===================== BOTTOM NAV ===================== */
#nav{position:absolute;left:0;right:0;bottom:0;z-index:40;display:flex;align-items:center;justify-content:space-around;
  padding:10px 14px calc(12px + env(safe-area-inset-bottom));background:var(--nav-bg);backdrop-filter:blur(16px);
  border-top:1px solid var(--line)}
.nav-i{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted2);font-size:10px;font-weight:700;
  flex:1;padding:4px 0;transition:.15s}
.nav-i svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav-i.on{color:var(--text)}
.nav-i.on svg{stroke:var(--accent)}
.nav-c{flex:0 0 auto;margin-top:-26px}
.nav-c .fab{width:58px;height:58px;border-radius:20px;background:linear-gradient(135deg,var(--accent),var(--green));
  display:flex;align-items:center;justify-content:center;box-shadow:var(--glow);transition:.15s}
.nav-c .fab:active{transform:scale(.92)}
.nav-c .fab svg{width:27px;height:27px;stroke:var(--accent-ink);stroke-width:2.4}

/* assistant FAB */
#aiFab{position:absolute;right:16px;bottom:96px;z-index:45;width:52px;height:52px;border-radius:18px;
  background:linear-gradient(135deg,var(--purple),#5b7bff);box-shadow:var(--shadow-sm);display:flex;
  align-items:center;justify-content:center;font-size:23px;transition:.15s}
#aiFab:active{transform:scale(.9)}

/* rest timer overlay */
#rest{position:absolute;inset:0;z-index:55;display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:22px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px)}
#rest.open{display:flex;animation:fade .25s}
#rest .lab{font-size:14px;color:var(--muted);font-weight:800;letter-spacing:2px;text-transform:uppercase}
#rest .num{font-size:74px;font-weight:850;letter-spacing:-2px;font-variant-numeric:tabular-nums}

/* badges */
.badge{display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center}
.badge .b{width:62px;height:62px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:28px;
  background:var(--card2);border:1px solid var(--line);filter:grayscale(1) opacity(.4)}
.badge.got .b{filter:none;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 30%,var(--card)),var(--card2));
  border-color:color-mix(in srgb,var(--accent) 40%,transparent);box-shadow:var(--glow)}
.badge small{font-size:10.5px;color:var(--muted);font-weight:700;line-height:1.2}

/* chat */
.bub{max-width:84%;padding:11px 14px;border-radius:18px;font-size:14px;line-height:1.45;margin-bottom:9px}
.bub.ai{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px;align-self:flex-start}
.bub.me{background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:6px;align-self:flex-end;font-weight:600}

.tip{font-size:12px;color:var(--muted);line-height:1.5}
.kpi{display:flex;align-items:baseline;gap:5px}
.kpi b{font-size:20px;font-weight:850}
.divline{height:1px;background:var(--line);margin:14px 0}
.empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:13.5px}
.pillstat{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-radius:14px;background:var(--card2);margin-bottom:8px}
.toast{position:absolute;left:50%;bottom:150px;transform:translateX(-50%);z-index:70;background:var(--text);color:var(--bg);
  padding:11px 18px;border-radius:14px;font-size:13.5px;font-weight:700;box-shadow:var(--shadow);opacity:0;transition:.3s;pointer-events:none;white-space:nowrap;max-width:90%}
.toast.show{opacity:1;bottom:160px}
.seg{display:flex;background:var(--card2);border-radius:13px;padding:4px;gap:4px}
.seg button{flex:1;padding:9px;border-radius:10px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.switch{width:46px;height:27px;border-radius:99px;background:var(--card3);position:relative;transition:.2s;flex:0 0 auto}
.switch.on{background:var(--accent)}
.switch i{position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 2px 5px rgba(0,0,0,.3)}
.switch.on i{left:22px}
</style>
</head>

<div id="app">

  <div id="screen" class="scroll"></div>

  <div id="aiFab">🤖</div>

  <nav id="nav"></nav>
  <div id="rest"></div>
  <div id="toast" class="toast"></div>
</div>

<div id="modal"></div>
<div id="overlay"></div>

let S = load();
function load(){
  try{ const r=JSON.parse(localStorage.getItem(LS_KEY)); if(r&&r.settings){ const d=defaultState(); return deepMerge(d,r);} }catch(e){}
  const d=defaultState(); d.installed=todayKey();
  // seed weight history
  d.weightHistory=seedWeights(d.profile.startWeight);
  return d;
}
function deepMerge(a,b){for(const k in b){if(b[k]&&typeof b[k]==="object"&&!Array.isArray(b[k])&&a[k]){deepMerge(a[k],b[k]);}else{a[k]=b[k];}}return a;}
function save(){ try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){} }
function seedWeights(start){
  const arr=[]; const today=new Date();
  for(let i=21;i>=0;i-=3){ const d=new Date(today); d.setDate(d.getDate()-i);
    const w = +(start + (i/21)*1.4 - Math.random()*0.4).toFixed(1);
    arr.push({date:dkey(d), w}); }
  return arr;
}

/* ----------------------- date helpers ----------------------- */
function dkey(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function todayKey(){ return dkey(new Date()); }
function dowMon(d){ return (d.getDay()+6)%7; } // 0=Mon
function log(key){ key=key||todayKey(); if(!S.logs[key]) S.logs[key]={water:0,meals:{},foods:{},workoutDone:false,sleep:null,tasks:{}}; return S.logs[key]; }
function t(k){ const L=I18N[S.settings.lang]||I18N.ru; return (k in L)?L[k]:(I18N.ru[k]??k); }
function locName(o){ return S.settings.lang==="uz" ? (o.uz||o.ru) : (o.ru||o.uz); }

function $(s,r){return (r||document).querySelector(s);}
function el(id){return document.getElementById(id);}
function toast(msg){ const e=el("toast"); e.textContent=msg; e.classList.add("show"); clearTimeout(e._t); e._t=setTimeout(()=>e.classList.remove("show"),1900); }
function ring(pct,size,stroke,color,track){
  size=size||72; stroke=stroke||8; color=color||"var(--accent)"; track=track||"var(--card3)";
  const r=(size-stroke)/2, c=2*Math.PI*r, off=c*(1-Math.max(0,Math.min(1,pct)));
  return `<svg width="${size}" height="${size}" class="ring"><circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="${track}" stroke-width="${stroke}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="${color}" stroke-width="${stroke}" stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg>`;
}

/* line chart (SVG) */
function lineChart(points,opts){
  opts=opts||{}; const W=opts.w||320,H=opts.h||130,pad=opts.pad||{l:6,r:6,t:14,b:18};
  if(!points.length) return `<div class="empty">${t("noData")}</div>`;
  const xs=points.map((p,i)=>i), ys=points.map(p=>p.v);
  let mn=Math.min(...ys),mx=Math.max(...ys); if(mn===mx){mn-=1;mx+=1;} const rng=mx-mn;
  const iw=W-pad.l-pad.r, ih=H-pad.t-pad.b;
  const X=i=> pad.l + (points.length===1?iw/2:(i/(points.length-1))*iw);
  const Y=v=> pad.t + ih - ((v-mn)/rng)*ih;
  let d=""; points.forEach((p,i)=>{ d+=(i?"L":"M")+X(i).toFixed(1)+" "+Y(p.v).toFixed(1)+" "; });
  let area=d+`L ${X(points.length-1)} ${pad.t+ih} L ${X(0)} ${pad.t+ih} Z`;
  let dots=points.map((p,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="3" fill="var(--accent)"/>`).join("");
  let labs=points.map((p,i)=> (i%Math.ceil(points.length/5||1)===0||i===points.length-1)?`<text x="${X(i).toFixed(1)}" y="${H-4}" font-size="9" fill="var(--muted)" text-anchor="middle">${p.l}</text>`:"").join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="none" style="display:block">
    <defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".28"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#ag)"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>${dots}${labs}</svg>`;
}
function barChart(bars,opts){
  opts=opts||{}; const W=opts.w||320,H=opts.h||120,pad={l:6,r:6,t:10,b:20};
  if(!bars.length) return `<div class="empty">${t("noData")}</div>`;
  const mx=Math.max(1,...bars.map(b=>b.v)); const iw=W-pad.l-pad.r, ih=H-pad.t-pad.b;
  const bw=iw/bars.length*0.56, gap=iw/bars.length;
  let r=bars.map((b,i)=>{ const h=(b.v/mx)*ih; const x=pad.l+i*gap+(gap-bw)/2; const y=pad.t+ih-h;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(2,h).toFixed(1)}" rx="4" fill="${b.c||'var(--accent)'}"/>
    <text x="${(x+bw/2).toFixed(1)}" y="${H-6}" font-size="9" fill="var(--muted)" text-anchor="middle">${b.l}</text>`;}).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">${r}</svg>`;
}

function startWorkout(){ const dk=SCHEDULE[dowMon(new Date())]; if(dk==="rest")return;
  if(!S.session||S.session.dk!==todayKey()) S.session={dk:todayKey(),wkey:dk,exIdx:0,sets:{}};
  S.workoutActive=true; save(); render(); }
function workoutSession(){
  const ses=S.session; const d=WDAYS[ses.wkey]; const ex=d.ex[ses.exIdx];
  const doneSets=ses.sets[ses.exIdx]||0; const total=d.ex.reduce((a,e)=>a+e.sets,0);
  const completed=Object.entries(ses.sets).reduce((a,[k,v])=>a+Math.min(v,d.ex[k].sets),0);
  const prog=completed/total;
  return `
  <div class="row" style="align-items:center;margin:8px 0 14px;gap:12px">
    <button class="iconbtn" onclick="exitSession()">←</button>
    <div style="flex:1"><div class="bar"><i style="width:${prog*100}%"></i></div></div>

      <div class="card2 card" style="padding:12px 18px;border:none"><div class="muted" style="font-size:11px;font-weight:700">${t("reps")}</div><div style="font-size:22px;font-weight:850">${ex.reps}</div></div>
      <div class="card2 card" style="padding:12px 18px;border:none"><div class="muted" style="font-size:11px;font-weight:700">${t("rest")}</div><div style="font-size:22px;font-weight:850">${ex.rest}${t("sec")}</div></div>
    </div>
  </div>
  <div class="card card2" style="margin-top:12px;border:none"><div style="font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:800">💡 ${t("tipLabel")}</div><div style="font-size:13.5px;margin-top:6px;line-height:1.5">${S.settings.lang==='uz'?ex.tuz:ex.tru}</div></div>

  <div style="margin-top:16px">
    <button class="btn" onclick="finishSet()">${doneSets+1>=ex.sets?(ses.exIdx>=d.ex.length-1?t("finishWorkout"):t("nextEx")+' →'):t("finishSet")+' ✓'}</button>
  </div>
  <div class="sec-h"><h2>${locName(d)}</h2></div>
  ${d.ex.map((e,i)=>{const ds=ses.sets[i]||0;const fin=ds>=e.sets;return `<div class="lrow" style="opacity:${i===ses.exIdx?1:.6}" onclick="jumpEx(${i})">
    <div class="ck" style="width:26px;height:26px;border:2px solid ${fin?'transparent':'var(--line2)'};background:${fin?'var(--accent)':'transparent'};color:${fin?'var(--accent-ink)':'transparent'};border-radius:8px;display:flex;align-items:center;justify-content:center;flex:0 0 auto">✓</div>
    <div class="mid"><div class="t1">${locName(e)}</div><div class="t2">${Math.min(ds,e.sets)}/${e.sets} ${t("sets")} · ${e.reps}</div></div>

  `;

function jumpEx(i){ S.session.exIdx=i; save(); render(); }
function exitSession(){ S.workoutActive=false; save(); render(); }
function finishSet(){
  const ses=S.session; const d=WDAYS[ses.wkey]; const ex=d.ex[ses.exIdx];
  ses.sets[ses.exIdx]=(ses.sets[ses.exIdx]||0)+1; save();
  const exDone=ses.sets[ses.exIdx]>=ex.sets;
  const allDone=d.ex.every((e,i)=>(ses.sets[i]||0)>=e.sets);
  if(allDone){ completeWorkout(); return; }
  if(exDone){ // advance to next not-finished exercise
    let n=ses.exIdx; for(let k=1;k<=d.ex.length;k++){ const j=(ses.exIdx+k)%d.ex.length; if((ses.sets[j]||0)<d.ex[j].sets){n=j;break;} }
    ses.exIdx=n; save();
    if(ex.rest>0) startRest(ex.rest,render); else render();
  } else {
    if(ex.rest>0) startRest(ex.rest,render); else render();
  }
}
function completeWorkout(){ const l=log(); l.workoutDone=true; bumpStreak(); S.workoutActive=false; save();
  toast(t("workoutDone")); if(S.settings.voice) speak(t("greatJob"));
  openSheet(`<div style="text-align:center;padding:14px 0 6px"><div style="font-size:60px">🎉</div>

   <button class="btn" style="margin-top:18px" onclick="closeModal();go('home')">${t("save")} ✓</button></div>`);
  render();
}

function analyticsBlock(){
  const days = S.progTab==='weekly'?7:30;
  const arr=[]; const today=new Date();
  for(let i=days-1;i>=0;i--){ const d=new Date(today); d.setDate(d.getDate()-i); const l=S.logs[dkey(d)];
    arr.push({d, cal:l?mealsKcal(dkey(d)):0, w:l&&l.workoutDone?1:0, water:l?l.water:0, sleep:l&&l.sleep?l.sleep.h:0}); }
  const active=arr.filter(x=>x.cal||x.w||x.water);
  const avgCal=active.length?Math.round(active.reduce((a,x)=>a+x.cal,0)/active.length):0;
  const wsum=arr.reduce((a,x)=>a+x.w,0);
  const avgWater=active.length?Math.round(active.reduce((a,x)=>a+x.water,0)/active.length):0;
  const sleeps=arr.filter(x=>x.sleep); const avgSleep=sleeps.length?(sleeps.reduce((a,x)=>a+x.sleep,0)/sleeps.length).toFixed(1):0;
  let bars;
  if(S.progTab==='weekly') bars=arr.map(x=>({v:x.cal,l:t("weekdays")[dowMon(x.d)],c:x.cal>=S.goals.calories?"var(--green)":"var(--orange)"}));
  else { bars=[]; for(let wkn=0;wkn<Math.ceil(days/7);wkn++){ const slice=arr.slice(wkn*7,wkn*7+7); const a=slice.filter(x=>x.cal); const v=a.length?Math.round(a.reduce((s,x)=>s+x.cal,0)/a.length):0; bars.push({v,l:"W"+(wkn+1),c:"var(--orange)"}); } }
  return `<div class="card">
    <div class="muted" style="font-size:11px;font-weight:800;margin-bottom:8px">${t("calories")} · ${t("avg")} ${avgCal} ${t("kcal")}</div>
    ${barChart(bars,{h:120})}
    <div class="divline"></div>
    <div class="grid3" style="text-align:center">
      <div><div style="font-size:20px;font-weight:850">${wsum}</div><div class="muted" style="font-size:10.5px;font-weight:700">${t("workoutsDone")}</div></div>
      <div><div style="font-size:20px;font-weight:850;color:var(--water)">${(avgWater/1000).toFixed(1)}${t("l")}</div><div class="muted" style="font-size:10.5px;font-weight:700">${t("water")} ${t("avg")}</div></div>
      <div><div style="font-size:20px;font-weight:850;color:var(--sleep)">${avgSleep}${t("hours")}</div><div class="muted" style="font-size:10.5px;font-weight:700">${t("sleep")} ${t("avg")}</div></div>
    </div>
  </div>`;
}

function aiPush(who,txt){ const c=el("chat"); const b=document.createElement("div"); b.className="bub "+(who==="me"?"me":"ai"); b.textContent=txt; c.appendChild(b); c.scrollTop=c.scrollHeight; }
function aiSend(){ const inp=el("aiIn"); const q=(inp.value||"").trim(); if(!q)return; aiPush("me",q); inp.value=""; setTimeout(()=>aiPush("ai",aiReply(q)),300); }
function aiReply(q){
  const s=q.toLowerCase(); const uz=S.settings.lang==="uz";
  const eat=mealsKcal(), wl=S.goals.calories-eat, w=S.profile.currentWeight, gw=S.profile.goalWeight;
  const water=log().water, wg=S.goals.water;
  if(/калор|kalor|сколько.*ост|qancha.*qol|qoldi/.test(s))
    return uz?`Bugun ${eat} kkal iste'mol qildingiz, maqsad ${S.goals.calories} kkal. ${wl>0?wl+" kkal qoldi.":"Maqsadga yetdingiz 🎯"}`:`Сегодня съедено ${eat} ккал из ${S.goals.calories}. ${wl>0?"Осталось "+wl+" ккал.":"Норма достигнута 🎯"}`;
  if(/вод|suv|пить|ich/.test(s))
    return uz?`Bugun ${water} ml suv ichdingiz (maqsad ${wg} ml). ${water<wg?"Yana "+(wg-water)+" ml iching 💧":"Ajoyib, maqsadga yetdingiz 💧"}`:`Вы выпили ${water} мл воды (цель ${wg} мл). ${water<wg?"Выпейте ещё "+(wg-water)+" мл 💧":"Отлично, цель достигнута 💧"}`;
  if(/прогресс|progress|вес|vazn/.test(s)){
    const diff=+(S.profile.startWeight-w).toFixed(1);
    return uz?`Boshlang‘ich vazn ${S.profile.startWeight} kg, hozir ${w} kg. ${diff>0?diff+" kg tashladingiz! 🔥":"Davom eting, natija keladi."} Maqsadgacha ${(w-gw).toFixed(1)} kg.`:`Стартовый вес ${S.profile.startWeight} кг, сейчас ${w} кг. ${diff>0?"Вы сбросили "+diff+" кг! 🔥":"Продолжайте, результат придёт."} До цели ${(w-gw).toFixed(1)} кг.`;
  }
  if(/съесть|поесть|еда|nima.*ye|ovqat|taom/.test(s))
    return uz?`Oqsilga e'tibor bering: tovuq, baliq, tuxum. ${wl>200?"Hali "+wl+" kkal bor — yengil tushlik yoki yong‘oq mos keladi.":"Bugunga deyarli yetarli, yengil narsa tanlang."}`:`Сделайте упор на белок: курица, рыба, яйца. ${wl>200?"Ещё есть "+wl+" ккал — подойдёт лёгкий перекус или орехи.":"На сегодня почти норма, выберите что-то лёгкое."}`;
  if(/совет|maslahat|tip|мотив/.test(s)){ const qs=QUOTES[S.settings.lang]; return qs[Math.floor(Math.random()*qs.length)]; }
  if(/трениров|mashq|workout|упражн/.test(s)){ const dk=SCHEDULE[dowMon(new Date())]; const d=WDAYS[dk];
    return dk==="rest"?(uz?"Bugun dam olish kuni. Yengil cho‘zilish va sayr qiling 🧘":"Сегодня день отдыха. Лёгкая растяжка и прогулка 🧘"):(uz?`Bugun: ${locName(d)} — ${d.ex.length} ta mashq. Boshlashga tayyormisiz? 💪`:`Сегодня: ${locName(d)} — ${d.ex.length} упражнений. Готовы начать? 💪`);}
  if(/сон|uyqu|sleep|спать/.test(s))
    return uz?`Maqsad ${S.goals.sleep} soat uyqu. Yotishdan oldin ekrandan uzoqlashing va xonani qorong‘i qiling.`:`Цель — ${S.goals.sleep} ч сна. Перед сном меньше экранов и затемните комнату.`;
  return uz?"Men ovqat, suv, mashq, uyqu va progress bo‘yicha yordam bera olaman. Aniqroq so‘rang 🙂":"Я помогу с питанием, водой, тренировками, сном и прогрессом. Спросите конкретнее 🙂";
}

/* =====================================================================
   REST TIMER
   ===================================================================== */
let restInt=null;
function startRest(sec,onDone){
  const o=el("rest"); let left=sec; o.classList.add("open");
  const draw=()=>{ o.innerHTML=`<div class="lab">${t("rest")}</div>${ring(left/sec,170,12,"var(--accent)")}
    <div class="num" style="position:absolute">${left}</div>
    <div class="row" style="position:absolute;bottom:90px;gap:10px">
      <button class="btn ghost sm" onclick="addRest(10)">+10 ${t("sec")}</button>
      <button class="btn sm" onclick="skipRest()">${t("finishSet")} ✓</button>
    </div>`; };
  draw();
  o._left=()=>left; o._set=v=>{left=v;}; o._sec=sec; o._done=onDone;
  clearInterval(restInt);
  restInt=setInterval(()=>{ left--; o._set(left); if(left<=0){ skipRest(); return;} draw(); beep(left<=3?660:0); },1000);
}
function addRest(n){ const o=el("rest"); o._set(o._left()+n); }
function skipRest(){ clearInterval(restInt); const o=el("rest"); o.classList.remove("open"); o.innerHTML=""; beep(880); if(S.settings.voice) speak(S.settings.lang==="uz"?"Davom etamiz":"Продолжаем"); if(o._done) o._done(); }
let actx=null;
function beep(f){ if(!f)return; try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); const o=actx.createOscillator(),g=actx.createGain(); o.frequency.value=f; o.connect(g); g.connect(actx.destination); g.gain.setValueAtTime(.12,actx.currentTime); g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+.18); o.start(); o.stop(actx.currentTime+.19);}catch(e){} }
function speak(txt){ try{ const u=new SpeechSynthesisUtterance(txt); u.lang=S.settings.lang==="uz"?"uz-UZ":"ru-RU"; u.rate=1; speechSynthesis.cancel(); speechSynthesis.speak(u);}catch(e){} }

/* =====================================================================
   REMINDERS (in-page, while open)
   ===================================================================== */
async function enableNotif(){
  if(!("Notification" in window)){ toast(t("notifBlocked")); return; }
  let p=Notification.permission; if(p!=="granted") p=await Notification.requestPermission();
  if(p==="granted"){ S.settings.notif=true; save(); toast(t("notifOn")); render(); } else { toast(t("notifBlocked")); }
}
const _fired={};
function reminderTick(){
  const now=new Date(); const hm=String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0"); const dk=todayKey();
  const map={water:"remWater",meal:"remMeal",workout:"remWorkout",sleep:"remSleep"};
  for(const k in S.reminders){ const r=S.reminders[k]; if(!r.on||r.time!==hm) continue;
    const tag=dk+"_"+k; if(_fired[tag]) continue; _fired[tag]=1;
    const title="FitLife", body=t(map[k]);
    if(S.settings.notif && "Notification" in window && Notification.permission==="granted"){ try{new Notification(title,{body});}catch(e){} }
    if(S.settings.voice) speak(body);
    toast("🔔 "+body);
  }
}

/* =====================================================================
   ACHIEVEMENTS / STREAK
   ===================================================================== */
function unlock(id){ if(!S.achievements.includes(id)){ S.achievements.push(id); save(); const a=ACHV.find(x=>x.id===id); toast("🏆 "+locName(a)); if(S.settings.voice) speak(t("congrats")); } }
function checkAchievements(){
  const totalW=Object.values(S.logs).filter(l=>l.workoutDone).length;
  if(totalW>=1) unlock("first_w");
  if(totalW>=10) unlock("w10");
  if(S.streak.count>=3) unlock("streak3");
  if(S.streak.count>=7) unlock("streak7");
  const waterHit=Object.values(S.logs).filter(l=>l.water>=S.goals.water).length; if(waterHit>=5) unlock("water5");
  if(S.profile.startWeight-S.profile.currentWeight>=1) unlock("loss");
  if(taskPct()>=1) unlock("perfect");
  const installed=S.installed?Math.floor((Date.now()-new Date(S.installed))/864e5):0; if(installed>=30) unlock("month");
}
function bumpStreak(){
  const tk=todayKey(); if(S.streak.last===tk) return;
  const y=new Date(); y.setDate(y.getDate()-1);
  S.streak.count = (S.streak.last===dkey(y))? S.streak.count+1 : 1;
  S.streak.last=tk; save();
}

/* =====================================================================
   SHARED CALC
   ===================================================================== */
function mealsKcal(key){ const l=log(key); let s=0;
  for(const m in MEALPLAN){ if(l.meals[m]) s+=MEALPLAN[m].items.reduce((a,b)=>a+b.kc,0); }
  for(const m in (l.foods||{})){ (l.foods[m]||[]).forEach(f=>{ if(f.eaten!==false) s+=(+f.kc||0); }); }
  return s;
}
function mealsMacros(key){ const l=log(key); let p=0,c=0,f=0;
  for(const m in MEALPLAN){ if(l.meals[m]) MEALPLAN[m].items.forEach(i=>{p+=i.p;c+=i.c;f+=i.f;}); }
  for(const m in (l.foods||{})){ (l.foods[m]||[]).forEach(x=>{ if(x.eaten!==false){p+=(+x.p||0);c+=(+x.c||0);f+=(+x.f||0);} }); }
  return {p,c,f};
}
function todayTasks(){
  const l=log(); const sc=SCHEDULE[dowMon(new Date())];
  const list=[
    {id:"water",ic:"💧",txt:t("remWater"),done:l.water>=S.goals.water},
    {id:"breakfast",ic:"🍳",txt:t("breakfast"),done:!!l.meals.breakfast},
    {id:"lunch",ic:"🥗",txt:t("lunch"),done:!!l.meals.lunch},
    {id:"dinner",ic:"🍲",txt:t("dinner"),done:!!l.meals.dinner},
  ];
  if(sc!=="rest") list.push({id:"workout",ic:"🏋️",txt:t("workout")+" · "+locName(WDAYS[sc]),done:l.workoutDone});
  list.push({id:"sleep",ic:"😴",txt:t("remSleep"),done:!!l.sleep});
  return list;
}
function taskPct(){ const ts=todayTasks(); return ts.length? ts.filter(x=>x.done).length/ts.length : 0; }
function toggleTask(id){
  const l=log();
  if(id==="water"){ l.water = l.water>=S.goals.water?0:S.goals.water; }
  else if(id==="sleep"){ if(l.sleep) l.sleep=null; else l.sleep={h:S.goals.sleep,q:"ok"}; }
  else if(id==="workout"){ l.workoutDone=!l.workoutDone; if(l.workoutDone) bumpStreak(); }
  else { l.meals[id]=!l.meals[id]; }
  if(taskPct()>=1){ bumpStreak(); toast(t("allDone")); }
  save(); render();
}

function closeModal(){ el("modal").className=""; el("modal").innerHTML=""; }
function openSheet(html){ el("modal").className="open"; el("modal").innerHTML=`<div class="scrim" onclick="closeModal()"></div><div class="sheet"><div class="grab"></div>${html}</div>`; }

/* =====================================================================
   BMI
   ===================================================================== */
function bmiVal(w,h){ h=h/100; return +(w/(h*h)).toFixed(1); }
function bmiCat(b){ return b<18.5?{k:"bmi_under",c:"var(--blue)"}:b<25?{k:"bmi_norm",c:"var(--green)"}:b<30?{k:"bmi_over",c:"var(--orange)"}:{k:"bmi_obese",c:"var(--red)"}; }

/* =====================================================================
   BOOT
   ===================================================================== */
el("aiFab").onclick=openAI;
render();
setInterval(reminderTick,15000);
window.go=go; window.toggleTask=toggleTask; window.closeModal=closeModal; window.openAI=openAI;
window.aiSend=aiSend; window.startRest=startRest; window.addRest=addRest; window.skipRest=skipRest; window.enableNotif=enableNotif;
</script>
